name: Import verified reference images

on:
  push:
    branches:
      - feat/full-site-visual-parity-audit
      - fix/remaining-editorial-visual-parity
      - fix/home-v3-source-services-and-cta

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Import source imagery
        run: node app/scripts/restore-original-assets.mjs --download

      - name: Commit downloaded originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/assets/img app/public/assets/brand/partners
          if ! git diff --cached --quiet; then
            git commit -m "assets: import About page originals"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
