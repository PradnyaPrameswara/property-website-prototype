name: Import reference images

on:
  push:
    branches: [feat/restore-original-assets]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/restore-original-assets
          persist-credentials: true

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Import selected original images
        run: node app/scripts/restore-original-assets.mjs --download

      - name: Commit localized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public/assets/img app/public/assets/brand/partners
          if ! git diff --cached --quiet; then
            git commit -m "assets: add original visual reference images"
            git push origin HEAD:feat/restore-original-assets
          fi
