name: Verify Astro rewrite

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build lint plugin
        run: npm run build:lint-plugin

      - name: Lint
        run: npm run lint

      - name: Build Astro
        run: npm run build

      - name: Reject legacy runtime dependencies
        run: npm run check:rewrite -- --require-build

      - name: Check migrated routes and local assets
        run: npm run check:readiness

      - name: Verify form delivery and failure contracts
        run: npm run test:forms
      
      - name: Verify production form configuration contract
        run: |
          FORM_WEBHOOK_URL=https://forms.example.test/ingest FORM_WEBHOOK_TOKEN=test-secret npm run check:forms-production -- --strict
          if env -u FORM_WEBHOOK_URL -u FORM_WEBHOOK_TOKEN npm run check:forms-production -- --strict; then
            echo "Expected missing production secrets to block deployment"
            exit 1
          fi
